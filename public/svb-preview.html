<html lang="es">

<title>Checklist SVB</title>
<style>
:root{font-family:Arial,sans-serif;color:#20262a;background:#f3f5f6}*{box-sizing:border-box}body{margin:0}.app{max-width:900px;margin:auto;padding:12px}.head{text-align:center}.back{display:inline-block;margin-bottom:8px;padding:9px 14px;border-radius:10px;background:#fff;color:#075b6a;border:1px solid #9eb8bd;font-weight:800;text-decoration:none}.tag{display:inline-block;padding:6px 10px;border-radius:20px;background:#fff0b5;color:#704f00;font-weight:800;font-size:12px}.head h1{margin:10px 0 2px}.head h2{margin:0 0 10px}.progress{display:grid;gap:3px;padding:10px;margin-bottom:10px;border:1px solid #cbd5da;border-radius:12px;background:#fff;text-align:center}.progress small{color:#56636a}.map{position:relative;aspect-ratio:16/9;border:2px solid #cad1d4;border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 4px 16px #0002}.map img{display:block;width:100%;height:100%;object-fit:cover}.marker{position:absolute;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;font-size:20px;font-weight:900;border:4px solid #fff;box-shadow:0 2px 8px #0008;color:#fff}.pending{background:#65737b}.ok{background:#159447}.issue{background:#cf2727}.reset{width:100%;margin-top:10px;padding:12px;border:1px solid #9aa6ac;border-radius:10px;background:#fff;font-weight:700}.backdrop{position:fixed;inset:0;z-index:10;background:#0008;display:flex;align-items:flex-end;justify-content:center}.sheet{width:min(100%,720px);height:min(90dvh,820px);display:flex;flex-direction:column;background:#fff;border-radius:20px 20px 0 0;overflow:hidden}.sheet header{display:flex;align-items:center;justify-content:space-between;padding:14px;border-bottom:1px solid #d8dfe2}.sheet h2{margin:2px 0}.close{width:46px;height:46px;border:0;border-radius:50%;font-size:30px}.items{overflow:auto;padding:8px 12px}.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:9px 7px;border-bottom:1px solid #e0e5e7;border-radius:8px}.item.ok{background:#e1f5e8}.item.issue{background:#ffe2e2}.choices{display:flex;gap:6px}.choices button{width:44px;height:42px;border-radius:9px;font-size:22px;font-weight:900;background:#fff}.yes{border:2px solid #159447;color:#159447}.no{border:2px solid #cf2727;color:#cf2727}.yes.active{background:#159447;color:#fff}.no.active{background:#cf2727;color:#fff}.sheet footer{margin-top:auto;display:grid;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #d8dfe2;background:#fff}.state{text-align:center;padding:8px;border-radius:8px;font-weight:800}.done{padding:13px;border:0;border-radius:10px;background:#006477;color:#fff;font-size:17px;font-weight:800}.hidden{display:none}@media(max-width:520px){.app{padding:8px}.head h1{font-size:24px}.head h2{font-size:18px}.marker{width:38px;height:38px;border-width:3px;font-size:17px}.progress{font-size:14px}}@media(min-width:700px){.backdrop{align-items:center}.sheet{border-radius:20px}}
.items>h3{position:sticky;top:-8px;z-index:1;margin:0;padding:10px 8px;background:#eaf0f2;border-radius:8px;color:#075b6a;font-size:15px}
</style>
<style>.mark-all{width:100%;margin-bottom:8px;padding:12px;border:2px solid #159447;border-radius:10px;background:#fff;color:#116d36;font-size:16px;font-weight:800}.mark-all.active{background:#159447;color:#fff}</style>
<main class="app"><header class="head"><a class="back" href="./svb-zones.html?v=237">← Zonas del checklist</a><br><span class="tag">CHECKLIST OPERATIVO</span><h1>Checklist SVB <small>v237</small></h1><h2>Zona izquierda</h2></header><section class="progress"><strong id="progress"></strong><small>Gris: pendiente · Verde: correcto · Rojo: incidencia</small></section><div class="map"><img src="./checklists/svb-paret-lateral-esquerre-mobile.jpg" alt="Zona izquierda de la ambulancia"><div id="markers"></div></div></main><div class="backdrop hidden" id="modal"><section class="sheet"><header><div><small>Zona izquierda</small><h2 id="title"></h2></div><button class="close" id="close">×</button></header><div class="items" id="items"></div><footer><span class="state pending" id="state"></span><button class="done" id="done">Volver a la fotografía</button></footer></section></div>
<script type="module">
import{SVB_LEFT_WALL_SECTIONS}from"./checklists/svb-left-wall-data.js?v=237";
import{readSvbVehicleAssignment}from"./checklists/svb-vehicle-assignment.js?v=237";
document.querySelector(".head h1 small").textContent="v237";
const sections=SVB_LEFT_WALL_SECTIONS.map(section=>[section.id,section.items]);
const pos={1:[17,17],2:[18,34],3:[19,55],4:[20,73],5:[21,92],7:[49,17],8:[70,17],9:[90,17],10:[5,48],11:[84,48]},context=JSON.parse(localStorage.getItem("cma_svb_checklist_context_v1")||"{}"),scope=`${context.unit||"TSU"}:${context.guardCode||"prueba"}`,vehicle=readSvbVehicleAssignment(localStorage,context.unit,context.guardCode)||"sin-rotulacion",key=`cma_svb_left_wall_mobile_test_v1:${scope}:${vehicle}`;let answers=JSON.parse(localStorage.getItem(key)||"{}"),selected=null;
const byId=id=>document.getElementById(id);function status([id,items]){const values=items.map(item=>answers[id]?.[item]);return values.every(v=>v==="ok"||v==="issue")?(values.includes("issue")?"issue":"ok"):"pending"}function render(){byId("markers").innerHTML="";let complete=0;sections.forEach(section=>{const s=status(section);if(s!=="pending")complete++;const [x,y]=pos[section[0]],button=document.createElement("button");button.className=`marker ${s}`;button.style.left=x+"%";button.style.top=y+"%";button.textContent=section[0];button.onclick=()=>open(section[0]);byId("markers").append(button)});byId("progress").textContent=`${complete} de ${sections.length} compartimentos revisados`}function open(id){selected=id;const section=sections.find(s=>s[0]===id),container=byId("items");byId("title").textContent=id===11?"Compartimento 11 · Aspirador":id===10?"Compartimento 10 · Bolsa de férulas":`Compartimento ${id}`;container.innerHTML="";const all=document.createElement("button"),allOk=section[1].every(item=>answers[id]?.[item]==="ok");all.className=`mark-all ${allOk?"active":""}`;all.textContent=allOk?"✓ Todo marcado como correcto":"✓ Marcar todo correcto";all.onclick=()=>markAll(section);container.append(all);section[1].forEach(item=>{const kit=SVB_LEFT_WALL_SECTIONS.find(s=>s.id===id)?.kit;if(kit?.items[0]===item){const heading=document.createElement("h3");heading.textContent=kit.title;container.append(heading);}const value=answers[id]?.[item]||"",row=document.createElement("div");row.className=`item ${value}`;row.innerHTML=`<strong>${item}</strong><div class="choices"><button class="yes ${value==="ok"?"active":""}">✓</button><button class="no ${value==="issue"?"active":""}">✕</button></div>`;const buttons=row.querySelectorAll("button");buttons[0].onclick=()=>mark(item,"ok");buttons[1].onclick=()=>mark(item,"issue");container.append(row)});updateState();byId("modal").classList.remove("hidden")}function save(){localStorage.setItem(key,JSON.stringify(answers))}function markAll(section){answers[selected]={...(answers[selected]||{}),...Object.fromEntries(section[1].map(item=>[item,"ok"]))};save();open(selected);render()}function mark(item,value){answers[selected]={...(answers[selected]||{}),[item]:value};save();open(selected);render()}function updateState(){const s=status(sections.find(x=>x[0]===selected)),el=byId("state");el.className=`state ${s}`;el.textContent=s==="pending"?"Faltan elementos por revisar":s==="ok"?"Compartimento correcto":"Compartimento con incidencia"}function close(){byId("modal").classList.add("hidden");render()}byId("close").onclick=close;byId("done").onclick=close;render();
</script>
</html>
