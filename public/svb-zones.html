<style>:root{font-family:Arial,sans-serif;background:#f3f5f6;color:#20262a}*{box-sizing:border-box}body{margin:0}.app{max-width:680px;margin:auto;padding:18px 12px}.head{text-align:center}.back{display:inline-block;padding:9px 13px;border:1px solid #9eb8bd;border-radius:10px;background:#fff;color:#075b6a;font-weight:800;text-decoration:none}.tag{display:inline-block;margin-top:10px;padding:6px 10px;border-radius:20px;background:#fff0b5;color:#704f00;font-size:12px;font-weight:900}h1{margin:12px 0 2px}h2{margin:0 0 18px}.zones{display:grid;gap:12px}.zone{display:grid;grid-template-columns:18px 1fr auto;align-items:center;gap:12px;padding:18px 14px;border:2px solid #b9c3c8;border-radius:14px;background:#fff;color:#20262a;text-decoration:none;box-shadow:0 3px 10px #0001}.dot{width:18px;height:18px;border-radius:50%;background:#65737b}.zone strong{font-size:19px}.zone small{color:#5e6a70}.zone .arrow{font-size:26px;font-weight:900}.zone.ok{border-color:#159447;background:#eaf8ef}.zone.ok .dot{background:#159447}.zone.issue{border-color:#cf2727;background:#fff0f0}.zone.issue .dot{background:#cf2727}.zone.pending{border-color:#87949a}.future{opacity:.58}.legend{margin-top:16px;padding:12px;border-radius:12px;background:#fff;text-align:center;color:#58666c;font-size:13px}</style>
<main class="app"><header class="head"><a class="back" href="./">← Registro de consumo</a><br><span class="tag">PRUEBA · NO ENVÍA DATOS</span><h1>Checklist SVB <small>v177</small></h1><h2>Selecciona una zona</h2></header><section class="zones"><a id="left" class="zone pending" href="./svb-preview.html"><span class="dot"></span><span><strong>Pared lateral izquierda</strong><br><small>Disponible para pruebas</small></span><span class="arrow">›</span></a><a id="front" class="zone pending" href="./svb-front-preview.html"><span class="dot"></span><span><strong>Pared frontal</strong><br><small>Disponible para pruebas</small></span><span class="arrow">›</span></a><div class="zone future"><span class="dot"></span><span><strong>Pared lateral derecha</strong><br><small>Próximamente</small></span></div></section><p class="legend">Gris: pendiente · Verde: completado · Rojo: incidencia</p></main>
<script type="module">import{SVB_FRONT_WALL_SECTIONS as frontSections,frontSectionStatus}from"./checklists/svb-front-wall-data.js";function read(key){try{return JSON.parse(localStorage.getItem(key)||"{}")}catch{return{}}}function paint(id,state){const el=document.getElementById(id);el.classList.remove("pending","ok","issue");el.classList.add(state)}const left=read("cma_svb_left_wall_mobile_test_v1"),leftValues=Object.values(left).flatMap(row=>Object.values(row||{}));paint("left",leftValues.includes("issue")?"issue":Object.keys(left).length>=8&&leftValues.length&&leftValues.every(v=>v==="ok")?"ok":"pending");const front=read("cma_svb_front_wall_mobile_test_v1"),frontStates=frontSections.filter(s=>!s.pendingDefinition).map(s=>frontSectionStatus(s,front));paint("front",frontStates.includes("issue")?"issue":frontStates.length&&frontStates.every(s=>s==="ok")?"ok":"pending");</script></html>
