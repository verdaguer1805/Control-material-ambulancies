<!doctype html><html lang="es"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Zonas · Checklist SVB</title>
<style>:root{font-family:Arial,sans-serif;background:#f3f5f6;color:#20262a}*{box-sizing:border-box}body{margin:0}.app{max-width:680px;margin:auto;padding:18px 12px}.head{text-align:center}.back{display:inline-block;padding:9px 13px;border:1px solid #9eb8bd;border-radius:10px;background:#fff;color:#075b6a;font-weight:800;text-decoration:none}.tag{display:inline-block;margin-top:10px;padding:6px 10px;border-radius:20px;background:#fff0b5;color:#704f00;font-size:12px;font-weight:900}h1{margin:12px 0 2px}h2{margin:0 0 18px}.vehicle{margin:0 0 14px;padding:14px;border:2px solid #bc9500;border-radius:14px;background:#fff9dc}.vehicle.confirmed{border-color:#159447;background:#eaf8ef}.vehicle label{display:block;margin-bottom:7px;font-weight:900}.vehicle-row{display:grid;grid-template-columns:1fr auto;gap:8px}.vehicle input{min-width:0;padding:13px;border:2px solid #9ca8ad;border-radius:10px;font-size:20px;font-weight:900;letter-spacing:3px;text-align:center}.vehicle.confirmed input{border-color:#159447;background:#fff}.vehicle button{padding:0 16px;border:0;border-radius:10px;background:#006477;color:#fff;font-weight:900}.vehicle.confirmed button{background:#16703a}.vehicle-msg{display:block;margin-top:7px;color:#775900;font-weight:800}.vehicle.confirmed .vehicle-msg{color:#126a35;font-size:16px}.zones{display:grid;gap:12px}.zones.hidden,.legend.hidden{display:none}.zone{display:grid;grid-template-columns:18px 1fr auto;align-items:center;gap:12px;padding:18px 14px;border:2px solid #b9c3c8;border-radius:14px;background:#fff;color:#20262a;text-decoration:none;box-shadow:0 3px 10px #0001}.zone.locked{opacity:.45;pointer-events:none}.dot{width:18px;height:18px;border-radius:50%;background:#65737b}.zone strong{font-size:19px}.zone small{color:#5e6a70}.zone .arrow{font-size:26px;font-weight:900}.zone.ok{border-color:#159447;background:#eaf8ef}.zone.ok .dot{background:#159447}.zone.issue{border-color:#cf2727;background:#fff0f0}.zone.issue .dot{background:#cf2727}.zone.pending{border-color:#87949a}.future{opacity:.58}.legend{margin-top:16px;padding:12px;border-radius:12px;background:#fff;text-align:center;color:#58666c;font-size:13px}</style>
<main class="app"><header class="head"><a class="back" href="./">← Registro de consumo</a><br><span class="tag">PRUEBA · NO ENVÍA DATOS</span><h1>Checklist SVB <small>v185</small></h1><h2>Selecciona una zona</h2></header><section class="vehicle" id="vehicleCard"><label>Rotulación asignada por administración</label><strong id="vehicleNumber" style="display:block;font-size:28px;letter-spacing:3px;text-align:center"></strong><small class="vehicle-msg" id="vehicleMsg"></small></section><section class="zones hidden" id="zonesPanel"><a id="left" class="zone pending locked" href="./svb-preview.html"><span class="dot"></span><span><strong>Zona izquierda</strong><br><small>Disponible para pruebas</small></span><span class="arrow">›</span></a><a id="front" class="zone pending locked" href="./svb-front-preview.html"><span class="dot"></span><span><strong>Zona frontal</strong><br><small>Disponible para pruebas</small></span><span class="arrow">›</span></a><a id="right" class="zone pending locked" href="./svb-right-preview.html"><span class="dot"></span><span><strong>Zona derecha</strong><br><small>Disponible para pruebas</small></span><span class="arrow">›</span></a></section><p class="legend hidden" id="zonesLegend">Gris: pendiente · Verde: completado · Rojo: incidencia</p></main>
<script type="module">import{SVB_FRONT_WALL_SECTIONS as frontSections,frontSectionStatus}from"./checklists/svb-front-wall-data.js";import{SVB_RIGHT_ZONE_SECTIONS as rightSections,rightZoneStatus}from"./checklists/svb-right-zone-data.js";import{readSvbVehicleAssignment}from"./checklists/svb-vehicle-assignment.js";function read(key){try{return JSON.parse(localStorage.getItem(key)||"{}")}catch{return{}}}const context=read("cma_svb_checklist_context_v1"),scope=`${context.unit||"TSU"}:${context.guardCode||"prueba"}`,msg=document.getElementById("vehicleMsg"),number=document.getElementById("vehicleNumber"),card=document.getElementById("vehicleCard"),zones=document.getElementById("zonesPanel"),legend=document.getElementById("zonesLegend"),vehicle=readSvbVehicleAssignment(localStorage,context.unit,context.guardCode);function showZones(show){zones.classList.toggle("hidden",!show);legend.classList.toggle("hidden",!show)}function draftKey(zone){return`cma_svb_${zone}_${zone==="right"?"zone":"wall"}_mobile_test_v1:${scope}:${vehicle}`}function paint(id,state){const el=document.getElementById(id);el.classList.remove("pending","ok","issue");el.classList.add(state)}function refresh(){const validContext=context.checklist==="SVB"&&context.unit&&context.lot&&context.zone,valid=validContext&&/^\d{4}$/.test(vehicle);showZones(valid);for(const id of["left","front","right"])document.getElementById(id).classList.toggle("locked",!valid);card.classList.toggle("confirmed",valid);number.textContent=valid?vehicle:"NO CONFIGURADA";msg.textContent=valid?`✓ Vehículo ${vehicle} asignado a ${context.unit}. Para cambiarlo vuelve a Registro de consumo y pulsa «Cambiar vehículo SVB».`:"Administración debe asignar primero la rotulación del vehículo.";if(!valid)return;const left=read(draftKey("left")),leftValues=Object.values(left).flatMap(row=>Object.values(row||{}));paint("left",leftValues.includes("issue")?"issue":Object.keys(left).length>=8&&leftValues.length&&leftValues.every(v=>v==="ok")?"ok":"pending");const front=read(draftKey("front")),frontStates=frontSections.filter(s=>!s.pendingDefinition).map(s=>frontSectionStatus(s,front));paint("front",frontStates.includes("issue")?"issue":frontStates.length&&frontStates.every(s=>s==="ok")?"ok":"pending");const right=read(draftKey("right")),rightStates=rightSections.map(s=>rightZoneStatus(s,right));paint("right",rightStates.includes("issue")?"issue":rightStates.length&&rightStates.every(s=>s==="ok")?"ok":"pending")}refresh();</script></html>
