<!doctype html><html lang="es"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Zona derecha · Checklist SVB</title>
<style>
:root{font-family:Arial,sans-serif;color:#20262a;background:#f3f5f6}*{box-sizing:border-box}body{margin:0}.app{max-width:720px;margin:auto;padding:8px}.head{text-align:center}.back{display:inline-block;padding:9px 12px;border-radius:10px;background:#fff;color:#075b6a;border:1px solid #9eb8bd;font-weight:800;text-decoration:none}.tag{display:inline-block;margin-top:8px;padding:6px 10px;border-radius:20px;background:#fff0b5;color:#704f00;font-weight:800;font-size:12px}.head h1{margin:10px 0 2px}.head h2{margin:0 0 10px}.progress{display:grid;gap:3px;padding:10px;margin-bottom:10px;border:1px solid #cbd5da;border-radius:12px;background:#fff;text-align:center}.progress small{color:#56636a}.map{position:relative;aspect-ratio:9/16;border:2px solid #cad1d4;border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 4px 16px #0002}.map img{display:block;width:100%;height:100%;object-fit:cover}.marker{position:absolute;transform:translate(-50%,-50%);width:36px;height:36px;border-radius:50%;font-size:15px;font-weight:900;border:3px solid #fff;box-shadow:0 2px 8px #0008;color:#fff}.marker.drawer{width:32px;height:32px;border-width:2px;font-size:14px}.pending{background:#65737b}.ok{background:#159447}.issue{background:#cf2727}.reset{width:100%;margin-top:10px;padding:12px;border:1px solid #9aa6ac;border-radius:10px;background:#fff;font-weight:700}.backdrop{position:fixed;inset:0;z-index:10;background:#0008;display:flex;align-items:flex-end;justify-content:center}.sheet{width:min(100%,720px);height:min(90dvh,820px);display:flex;flex-direction:column;background:#fff;border-radius:20px 20px 0 0;overflow:hidden}.sheet header{display:flex;align-items:center;justify-content:space-between;padding:14px;border-bottom:1px solid #d8dfe2}.sheet h2{margin:2px 0}.close{width:46px;height:46px;border:0;border-radius:50%;font-size:30px}.items{overflow:auto;padding:8px 12px}.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:10px 7px;border-bottom:1px solid #e0e5e7;border-radius:8px}.item.ok{background:#e1f5e8}.item.issue{background:#ffe2e2}.choices{display:flex;gap:6px}.choices button{width:44px;height:42px;border-radius:9px;font-size:22px;font-weight:900;background:#fff}.yes{border:2px solid #159447;color:#159447}.no{border:2px solid #cf2727;color:#cf2727}.yes.active{background:#159447;color:#fff}.no.active{background:#cf2727;color:#fff}.sheet footer{margin-top:auto;display:grid;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #d8dfe2;background:#fff}.state{text-align:center;padding:8px;border-radius:8px;font-weight:800}.done{padding:13px;border:0;border-radius:10px;background:#006477;color:#fff;font-size:17px;font-weight:800}.hidden{display:none}@media(min-width:700px){.backdrop{align-items:center}.sheet{border-radius:20px}}
</style>
<style>.mark-all{width:100%;margin-bottom:8px;padding:12px;border:2px solid #159447;border-radius:10px;background:#fff;color:#116d36;font-size:16px;font-weight:800}.mark-all.active{background:#159447;color:#fff}</style>
<main class="app"><header class="head"><a class="back" href="./svb-zones.html">← Zonas del checklist</a><br><span class="tag">CHECKLIST OPERATIVO</span><h1>Checklist SVB <small>v189</small></h1><h2>Zona derecha</h2></header><section class="progress"><strong id="progress"></strong><small>Gris: pendiente · Verde: correcto · Rojo: incidencia</small></section><div class="map"><img src="./checklists/svb-zona-derecha-mobile.jpg" alt="Zona derecha de la ambulancia"><div id="markers"></div></div></main><div class="backdrop hidden" id="modal"><section class="sheet"><header><div><small>Zona derecha</small><h2 id="title"></h2></div><button class="close" id="close" aria-label="Cerrar">×</button></header><div class="items" id="items"></div><footer><span class="state" id="state"></span><button class="done" id="done">Volver a la fotografía</button></footer></section></div>
<script type="module">
import{SVB_RIGHT_ZONE_SECTIONS as sections,rightZoneStatus as status}from"./checklists/svb-right-zone-data.js";
import{readSvbVehicleAssignment}from"./checklists/svb-vehicle-assignment.js";
document.querySelector(".head h1 small").textContent="v197";
const pos={1:[14,23],2:[33,22.3],3:[72,20.8],4:[65,35],5:[65,42],6:[65,49],8:[65,58.7],9:[65,61.3],10:[65,64.7],11:[65,74.5],12:[91,64]},context=JSON.parse(localStorage.getItem("cma_svb_checklist_context_v1")||"{}"),scope=`${context.unit||"TSU"}:${context.guardCode||"prueba"}`,vehicle=readSvbVehicleAssignment(localStorage,context.unit,context.guardCode)||"sin-rotulacion",key=`cma_svb_right_zone_mobile_test_v1:${scope}:${vehicle}`;let answers=JSON.parse(localStorage.getItem(key)||"{}"),selected=null;const byId=id=>document.getElementById(id);
function render(){byId("markers").innerHTML="";let complete=0;sections.forEach(section=>{const s=status(section,answers);if(s!=="pending")complete++;const[x,y]=pos[section.id],button=document.createElement("button");button.className=`marker ${section.id>=4&&section.id<=11?"drawer":""} ${s}`;button.style.left=x+"%";button.style.top=y+"%";button.textContent=section.id;button.onclick=()=>open(section.id);button.setAttribute("aria-label",section.title);byId("markers").append(button)});byId("progress").textContent=`${complete} de ${sections.length} zonas revisadas`}
function open(id){selected=id;const section=sections.find(s=>s.id===id),container=byId("items");byId("title").textContent=section.title;container.innerHTML="";const all=document.createElement("button"),allOk=section.items.every(item=>answers[id]?.[item]==="ok");all.className=`mark-all ${allOk?"active":""}`;all.textContent=allOk?"✓ Todo marcado como correcto":"✓ Marcar todo correcto";all.onclick=()=>markAll(section);container.append(all);section.items.forEach(item=>{const value=answers[id]?.[item]||"",row=document.createElement("div");row.className=`item ${value}`;row.innerHTML=`<strong>${item}</strong><div class="choices"><button class="yes ${value==="ok"?"active":""}" aria-label="Correcto">✓</button><button class="no ${value==="issue"?"active":""}" aria-label="Incidencia">✕</button></div>`;const buttons=row.querySelectorAll("button");buttons[0].onclick=()=>mark(item,"ok");buttons[1].onclick=()=>mark(item,"issue");container.append(row)});updateState();byId("modal").classList.remove("hidden")}
function save(){localStorage.setItem(key,JSON.stringify(answers))}function markAll(section){answers[selected]={...(answers[selected]||{}),...Object.fromEntries(section.items.map(item=>[item,"ok"]))};save();open(selected);render()}function mark(item,value){answers[selected]={...(answers[selected]||{}),[item]:value};save();open(selected);render()}function updateState(){const s=status(sections.find(x=>x.id===selected),answers),el=byId("state");el.className=`state ${s}`;el.textContent=s==="pending"?"Faltan elementos por revisar":s==="ok"?"Zona correcta":"Zona con incidencia"}function close(){byId("modal").classList.add("hidden");render()}byId("close").onclick=close;byId("done").onclick=close;render();
</script></html>
